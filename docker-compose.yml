name: universia

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-development}
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
  ROOT_PATH: /api
  DATABASE_URL: postgresql+asyncpg://universia_app:universia_app@postgres:5432/universia
  DATABASE_MIGRATIONS_URL: postgresql+asyncpg://${POSTGRES_USER:-universia}:${POSTGRES_PASSWORD:-universia}@postgres:5432/universia
  REDIS_URL: redis://redis:6379/0
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Falta ENCRYPTION_KEY en .env (corré make env)}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_TLS: ${SMTP_TLS:-false}
  EMAIL_FROM: ${EMAIL_FROM:-Universia <hola@example.com>}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  SEED_OPERATOR_EMAIL: ${SEED_OPERATOR_EMAIL:-operador@example.com}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-universia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-universia}
      POSTGRES_DB: universia
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-universia} -d universia"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes: [redis:/data]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  # Corre las migraciones una vez y termina; la API y el worker esperan a que salga bien.
  migrate:
    build: ./apps/api
    command: ["alembic", "upgrade", "head"]
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: ./apps/api
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 5s
      retries: 20

  worker:
    build:
      context: ./apps/api
      dockerfile: ../worker/Dockerfile
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  dashboard:
    build: ./apps/dashboard
    depends_on: [api]

  n8n:
    image: n8nio/n8n:1.123.4
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-universia}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-universia}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Falta N8N_ENCRYPTION_KEY en .env (corré make env)}
      N8N_SECURE_COOKIE: "false"
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      GENERIC_TIMEZONE: America/Argentina/Buenos_Aires
      UNIVERSIA_API_URL: http://api:8000
    volumes:
      - n8n:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    ports: ["127.0.0.1:5678:5678"]
    depends_on:
      postgres: { condition: service_healthy }

  # S3 compatible para audios, comprobantes y videos en local (en producción: Cloudflare R2).
  storage:
    image: chrislusf/seaweedfs:3.97
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333"]
    volumes: [storage:/data]
    ports: ["127.0.0.1:8333:8333"]

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:8025:8025"]

  caddy:
    image: caddy:2.10-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports: ["80:80", "443:443"]
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on: [api, dashboard]

volumes:
  postgres:
  redis:
  n8n:
  storage:
  caddy:
